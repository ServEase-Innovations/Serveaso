# Grafana Alloy / Agent scrape config — Serveaso DEV (Render).
# Import in Grafana Cloud → Connections → Collector → Alloy config, or run locally with Grafana Agent.
#
# Each job scrapes GET /metrics (public, no auth). Filter dashboards by label `service`.

global:
  scrape_interval: 30s
  scrape_timeout: 25s

scrape_configs:
  - job_name: serveaso-payments-dev
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["payments-vyqp.onrender.com"]
        labels: { service: payments, environment: dev }

  - job_name: serveaso-providers-dev
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["providers-k8w7.onrender.com"]
        labels: { service: providers, environment: dev }

