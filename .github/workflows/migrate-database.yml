# Apply Postgres migrations from DB_Migrations submodule before or after deploy.
# Prefer running this once per environment before Deploy Backend when schema changed.

name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: migrate-database-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install migration runner
        run: npm run db:install

      - name: Apply migrations (dev)
        if: inputs.environment == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::Set GitHub secret DEV_DATABASE_URL (postgres://...)"
            exit 1
          fi
          npm run db:migrate

      - name: Apply migrations (prod)
        if: inputs.environment == 'prod'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::Set GitHub secret PROD_DATABASE_URL (postgres://...)"
            exit 1
          fi
          npm run db:migrate

      - name: Summary
        run: |
          echo "### Database migrations" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ inputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`database/\` submodule → [DB_Migrations](https://github.com/ServEase-Innovations/DB_Migrations)" >> "$GITHUB_STEP_SUMMARY"
