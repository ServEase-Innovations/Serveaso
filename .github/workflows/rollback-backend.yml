# Roll back a production (EC2) backend service to a previous build version.

name: Rollback Backend (EC2)

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back
        required: true
        type: choice
        options:
          - payments
          - providers
          - coupons
          - preferences
          - utils
          - reviews
          - image-uploader
          - chat
      rollback_version:
        description: Build version folder (e.g. abc1234-42). Leave empty to use previous release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load service config
        id: cfg
        run: |
          jq -r --arg s "${{ inputs.service }}" '.[$s]' .github/deploy/services.json > service.json
          echo "ec2_app=$(jq -r '.ec2_app' service.json)" >> "$GITHUB_OUTPUT"
          echo "docker=$(jq -r '.docker // false' service.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve EC2 deploy path
        id: ec2path
        env:
          EC2_DEPLOY_PATH_PAYMENTS: ${{ secrets.EC2_DEPLOY_PATH_PAYMENTS }}
          EC2_DEPLOY_PATH_PROVIDERS: ${{ secrets.EC2_DEPLOY_PATH_PROVIDERS }}
          EC2_DEPLOY_PATH_COUPONS: ${{ secrets.EC2_DEPLOY_PATH_COUPONS }}
          EC2_DEPLOY_PATH_PREFERENCES: ${{ secrets.EC2_DEPLOY_PATH_PREFERENCES }}
          EC2_DEPLOY_PATH_UTILS: ${{ secrets.EC2_DEPLOY_PATH_UTILS }}
          EC2_DEPLOY_PATH_REVIEWS: ${{ secrets.EC2_DEPLOY_PATH_REVIEWS }}
          EC2_DEPLOY_PATH_IMAGE_UPLOADER: ${{ secrets.EC2_DEPLOY_PATH_IMAGE_UPLOADER }}
          EC2_DEPLOY_PATH_CHAT: ${{ secrets.EC2_DEPLOY_PATH_CHAT }}
        run: |
          default_path() {
            case "${{ inputs.service }}" in
              payments)       echo "/home/ubuntu/payments" ;;
              providers)      echo "/home/ubuntu/providers" ;;
              coupons)        echo "/home/ubuntu/coupons" ;;
              preferences)    echo "/home/ubuntu/preferences" ;;
              utils)          echo "/home/ubuntu/utils" ;;
              reviews)        echo "/home/ubuntu/reviews" ;;
              image-uploader) echo "/home/ubuntu/image-uploader" ;;
              chat)           echo "/home/ubuntu/chat" ;;
            esac
          }
          case "${{ inputs.service }}" in
            payments)       PATH="${EC2_DEPLOY_PATH_PAYMENTS:-$(default_path)}" ;;
            providers)      PATH="${EC2_DEPLOY_PATH_PROVIDERS:-$(default_path)}" ;;
            coupons)        PATH="${EC2_DEPLOY_PATH_COUPONS:-$(default_path)}" ;;
            preferences)    PATH="${EC2_DEPLOY_PATH_PREFERENCES:-$(default_path)}" ;;
            utils)          PATH="${EC2_DEPLOY_PATH_UTILS:-$(default_path)}" ;;
            reviews)        PATH="${EC2_DEPLOY_PATH_REVIEWS:-$(default_path)}" ;;
            image-uploader) PATH="${EC2_DEPLOY_PATH_IMAGE_UPLOADER:-$(default_path)}" ;;
            chat)           PATH="${EC2_DEPLOY_PATH_CHAT:-$(default_path)}" ;;
          esac
          echo "path=${PATH}" >> "$GITHUB_OUTPUT"

      - name: Roll back on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SERVICE: ${{ steps.cfg.outputs.ec2_app }}
          DEPLOY_ROOT: ${{ steps.ec2path.outputs.path }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          DOCKER: ${{ steps.cfg.outputs.docker }}
          PM2_APP: ${{ steps.cfg.outputs.ec2_app }}
        run: |
          chmod +x .github/scripts/ec2-rollback.sh
          .github/scripts/ec2-rollback.sh

      - name: List releases on server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_ROOT: ${{ steps.ec2path.outputs.path }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'Current:' && cat ${DEPLOY_ROOT}/VERSION 2>/dev/null || echo none; echo 'Releases:'; ls -1t ${DEPLOY_ROOT}/releases 2>/dev/null | head -10"
