# TEST-1 — smoke integration tests against DEV Render URLs.
# Triggers: manual, push to main, nightly schedule, post-deploy (dev) via workflow_call.

name: Integration Tests (DEV)

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "tests/integration/**"
      - "services/payments/src/utils/razorpayWebhookHmac.js"
      - "services/payments/test/**"
      - ".github/workflows/integration-tests.yml"
      - "package.json"

  schedule:
    # Daily smoke against DEV (06:00 UTC)
    - cron: "0 6 * * *"

  workflow_call:
    outputs:
      integration_status:
        description: success or failure
        value: ${{ jobs.integration.outputs.integration_status }}
      integration_pass:
        description: Total passed tests
        value: ${{ jobs.integration.outputs.integration_pass }}
      integration_fail:
        description: Total failed tests
        value: ${{ jobs.integration.outputs.integration_fail }}
      integration_skip:
        description: Total skipped tests
        value: ${{ jobs.integration.outputs.integration_skip }}

concurrency:
  group: integration-tests-dev-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      integration_status: ${{ steps.parse.outputs.status }}
      integration_pass: ${{ steps.parse.outputs.pass }}
      integration_fail: ${{ steps.parse.outputs.fail }}
      integration_skip: ${{ steps.parse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Run integration tests (DEV)
        env:
          INTEGRATION_PAYMENTS_URL: ${{ secrets.DEV_PAYMENTS_URL }}
          INTEGRATION_PROVIDERS_URL: ${{ secrets.DEV_PROVIDERS_URL }}
          INTEGRATION_UTILS_URL: ${{ secrets.DEV_UTILS_URL }}
          INTEGRATION_COUPONS_URL: ${{ secrets.DEV_COUPONS_URL }}
          INTEGRATION_REVIEWS_URL: ${{ secrets.DEV_REVIEWS_URL }}
          INTEGRATION_TICKETS_URL: ${{ secrets.DEV_TICKETS_URL }}
          INTEGRATION_PREFERENCES_URL: ${{ secrets.DEV_PREFERENCES_URL }}
          INTEGRATION_CHAT_URL: ${{ secrets.DEV_CHAT_URL }}
          INTEGRATION_IMAGE_UPLOADER_URL: ${{ secrets.DEV_IMAGE_UPLOADER_URL }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          INTEGRATION_INTERNAL_SECRET: ${{ secrets.INTEGRATION_INTERNAL_SECRET }}
          INTEGRATION_TEST_CUSTOMER_ID: ${{ secrets.INTEGRATION_TEST_CUSTOMER_ID }}
          INTEGRATION_TEST_PROVIDER_ID: ${{ secrets.INTEGRATION_TEST_PROVIDER_ID }}
          POSTGRES_DB: serveaso
        run: |
          echo "### Integration tests (DEV)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: **${{ github.event_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          npm run test:integration 2>&1 | tee /tmp/all-tests.log
          rc1=${PIPESTATUS[0]}
          npm run test --workspace=services/payments 2>&1 | tee -a /tmp/all-tests.log
          rc2=${PIPESTATUS[0]}
          if [[ "${rc1}" -ne 0 || "${rc2}" -ne 0 ]]; then
            exit 1
          fi

      - name: Parse test summary
        id: parse
        if: always()
        run: |
          pass="$(grep -E '^# pass ' /tmp/all-tests.log 2>/dev/null | awk '{s+=$3} END {print s+0}')"
          fail="$(grep -E '^# fail ' /tmp/all-tests.log 2>/dev/null | awk '{s+=$3} END {print s+0}')"
          skip="$(grep -E '^# skipped ' /tmp/all-tests.log 2>/dev/null | awk '{s+=$3} END {print s+0}')"
          echo "pass=${pass}" >> "$GITHUB_OUTPUT"
          echo "fail=${fail}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          if [[ "${fail}" -gt 0 ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pass | ${pass} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fail | ${fail} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skip | ${skip} |" >> "$GITHUB_STEP_SUMMARY"
