# Deploy Serveaso backend microservices.
# - dev  → Render (deploy hooks)
# - prod → EC2 (versioned releases + pm2 / Docker)
#
# Required secrets: see docs/DEPLOYMENT.md

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      service:
        description: Service to deploy (all = every backend in services.json)
        required: true
        type: choice
        options:
          - all
          - payments
          - providers
          - coupons
          - preferences
          - utils
          - reviews
          - tickets
          - image-uploader
          - chat
      wait_for_render:
        description: Dev only — poll Render until deploy finishes and print logs
        required: false
        type: boolean
        default: true
      run_migrations:
        description: Run DB_Migrations (database submodule) before deploying services
        required: false
        type: boolean
        default: true
      notify_on_deploy:
        description: Email deploy summary (requires DEPLOY_NOTIFY_EMAILS + SENDGRID_API_KEY)
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-backend-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ github.sha }}-${{ github.run_number }}

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          if [[ "${{ inputs.service }}" == "all" ]]; then
            SERVICES=$(jq -c 'keys' .github/deploy/services.json)
          else
            SERVICES=$(jq -c --arg s "${{ inputs.service }}" '[$s]' .github/deploy/services.json)
          fi
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${SERVICES} to ${{ inputs.environment }}"

  migrate-database:
    if: inputs.run_migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install migration runner
        run: npm run db:install

      - name: Apply migrations (dev)
        if: inputs.environment == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::Missing DEV_DATABASE_URL — run Migrate Database workflow or set secret. See docs/DEPLOYMENT.md"
            exit 1
          fi
          npm run db:migrate

      - name: Apply migrations (prod)
        if: inputs.environment == 'prod'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::Missing PROD_DATABASE_URL — set secret. See docs/DEPLOYMENT.md"
            exit 1
          fi
          npm run db:migrate

      - name: Migration summary
        run: |
          echo "DB migrations applied for **${{ inputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [resolve-matrix, migrate-database]
    if: always() && needs.resolve-matrix.result == 'success' && (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.resolve-matrix.outputs.services) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Load service config
        id: cfg
        run: |
          SVC="${{ matrix.service }}"
          jq -r --arg s "$SVC" '.[$s]' .github/deploy/services.json > service.json
          echo "label=$(jq -r '.label' service.json)" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r '.path' service.json)" >> "$GITHUB_OUTPUT"
          echo "ec2_app=$(jq -r '.ec2_app' service.json)" >> "$GITHUB_OUTPUT"
          echo "docker=$(jq -r '.docker // false' service.json)" >> "$GITHUB_OUTPUT"
          echo "install=$(jq -r '.install // "npm ci --omit=dev"' service.json)" >> "$GITHUB_OUTPUT"
          echo "pm2_script=$(jq -r '.pm2_script // ""' service.json)" >> "$GITHUB_OUTPUT"

      - name: Render — resolve hook and service id (dev)
        if: inputs.environment == 'dev'
        id: render_cfg
        env:
          RENDER_HOOK_PAYMENTS: ${{ secrets.RENDER_DEPLOY_HOOK_PAYMENTS }}
          RENDER_HOOK_PROVIDERS: ${{ secrets.RENDER_DEPLOY_HOOK_PROVIDERS }}
          RENDER_HOOK_COUPONS: ${{ secrets.RENDER_DEPLOY_HOOK_COUPONS }}
          RENDER_HOOK_PREFERENCES: ${{ secrets.RENDER_DEPLOY_HOOK_PREFERENCES }}
          RENDER_HOOK_UTILS: ${{ secrets.RENDER_DEPLOY_HOOK_UTILS }}
          RENDER_HOOK_REVIEWS: ${{ secrets.RENDER_DEPLOY_HOOK_REVIEWS }}
          RENDER_HOOK_TICKETS: ${{ secrets.RENDER_DEPLOY_HOOK_TICKETS }}
          RENDER_HOOK_IMAGE_UPLOADER: ${{ secrets.RENDER_DEPLOY_HOOK_IMAGE_UPLOADER }}
          RENDER_HOOK_CHAT: ${{ secrets.RENDER_DEPLOY_HOOK_CHAT }}
          RENDER_SVC_ID_PAYMENTS: ${{ secrets.RENDER_SERVICE_ID_PAYMENTS }}
          RENDER_SVC_ID_PROVIDERS: ${{ secrets.RENDER_SERVICE_ID_PROVIDERS }}
          RENDER_SVC_ID_COUPONS: ${{ secrets.RENDER_SERVICE_ID_COUPONS }}
          RENDER_SVC_ID_PREFERENCES: ${{ secrets.RENDER_SERVICE_ID_PREFERENCES }}
          RENDER_SVC_ID_UTILS: ${{ secrets.RENDER_SERVICE_ID_UTILS }}
          RENDER_SVC_ID_REVIEWS: ${{ secrets.RENDER_SERVICE_ID_REVIEWS }}
          RENDER_SVC_ID_TICKETS: ${{ secrets.RENDER_SERVICE_ID_TICKETS }}
          RENDER_SVC_ID_IMAGE_UPLOADER: ${{ secrets.RENDER_SERVICE_ID_IMAGE_UPLOADER }}
          RENDER_SVC_ID_CHAT: ${{ secrets.RENDER_SERVICE_ID_CHAT }}
        run: |
          case "${{ matrix.service }}" in
            payments)       HOOK="${RENDER_HOOK_PAYMENTS}"; SVC_ID="${RENDER_SVC_ID_PAYMENTS}" ;;
            providers)      HOOK="${RENDER_HOOK_PROVIDERS}"; SVC_ID="${RENDER_SVC_ID_PROVIDERS}" ;;
            coupons)        HOOK="${RENDER_HOOK_COUPONS}"; SVC_ID="${RENDER_SVC_ID_COUPONS}" ;;
            preferences)    HOOK="${RENDER_HOOK_PREFERENCES}"; SVC_ID="${RENDER_SVC_ID_PREFERENCES}" ;;
            utils)          HOOK="${RENDER_HOOK_UTILS}"; SVC_ID="${RENDER_SVC_ID_UTILS}" ;;
            reviews)        HOOK="${RENDER_HOOK_REVIEWS}"; SVC_ID="${RENDER_SVC_ID_REVIEWS}" ;;
            tickets)        HOOK="${RENDER_HOOK_TICKETS}"; SVC_ID="${RENDER_SVC_ID_TICKETS}" ;;
            image-uploader) HOOK="${RENDER_HOOK_IMAGE_UPLOADER}"; SVC_ID="${RENDER_SVC_ID_IMAGE_UPLOADER}" ;;
            chat)           HOOK="${RENDER_HOOK_CHAT}"; SVC_ID="${RENDER_SVC_ID_CHAT}" ;;
            *) echo "Unknown service"; exit 1 ;;
          esac
          if [[ -z "${HOOK}" ]]; then
            echo "::error::Missing Render deploy hook secret for ${{ matrix.service }}. See docs/DEPLOYMENT.md"
            exit 1
          fi
          # Deploy hook URL embeds the service id: https://api.render.com/deploy/srv-XXXX?key=…
          HOOK_SVC_ID="$(printf '%s' "${HOOK}" | sed -E 's|.*/(srv-[^/?]+).*|\1|')"
          if [[ "${HOOK_SVC_ID}" == "${HOOK}" ]]; then
            HOOK_SVC_ID=""
          fi
          if [[ -n "${HOOK_SVC_ID}" ]]; then
            if [[ -n "${SVC_ID}" && "${SVC_ID}" != "${HOOK_SVC_ID}" ]]; then
              echo "::warning::RENDER_SERVICE_ID_${{ matrix.service }} (${SVC_ID}) does not match deploy hook (${HOOK_SVC_ID}) — using hook value."
            fi
            SVC_ID="${HOOK_SVC_ID}"
          elif [[ -z "${SVC_ID}" ]]; then
            echo "::error::Set RENDER_SERVICE_ID_${{ matrix.service }} to srv-… from Render dashboard, or fix deploy hook URL."
            exit 1
          fi
          SERVICE_PATH="$(jq -r '.path' service.json)"
          {
            echo "RENDER_HOOK<<EOF"
            printf '%s\n' "${HOOK}"
            echo "EOF"
            echo "RENDER_SVC_ID=${SVC_ID}"
            echo "RENDER_SERVICE_PATH=${SERVICE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Render — push service repo to GitHub (dev)
        if: inputs.environment == 'dev'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/render-sync-submodule.sh
          .github/scripts/render-sync-submodule.sh "${RENDER_SERVICE_PATH}"

      - name: Render — trigger deploy (dev)
        if: inputs.environment == 'dev'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_SVC_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/render-deploy.sh
          export DEPLOY_CREATED_AFTER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          .github/scripts/render-deploy.sh "${RENDER_HOOK}" "${RENDER_SERVICE_PATH}"

      - name: Render — wait for deploy (dev)
        if: inputs.environment == 'dev' && inputs.wait_for_render == true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          RENDER_DEPLOY_WAIT_SECONDS: "2400"
        run: |
          chmod +x .github/scripts/render-watch-deploy.sh
          if [[ -z "${RENDER_API_KEY}" || -z "${RENDER_SVC_ID}" ]]; then
            echo "::error::wait_for_render is enabled but RENDER_API_KEY or RENDER_SERVICE_ID_${{ matrix.service }} is missing. Set both secrets or disable wait_for_render. See docs/DEPLOYMENT.md"
            exit 1
          fi
          export RENDER_API_KEY RENDER_OWNER_ID
          DEPLOY_ID=""
          if [[ -f /tmp/render-deploy-id.txt ]]; then
            DEPLOY_ID="$(cat /tmp/render-deploy-id.txt)"
          fi
          if [[ -n "${DEPLOY_ID}" ]]; then
            .github/scripts/render-watch-deploy.sh "${RENDER_SVC_ID}" "${DEPLOY_ID}"
          else
            echo "::warning::Deploy hook did not return deploy.id — watching latest deploy for service."
            .github/scripts/render-watch-deploy.sh "${RENDER_SVC_ID}"
          fi

      - name: Upload Render logs (dev)
        if: inputs.environment == 'dev' && inputs.wait_for_render == true
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: render-logs-${{ matrix.service }}-${{ github.run_number }}
          path: ${{ runner.temp }}/render-logs/
          if-no-files-found: ignore

      - name: Write prod env file
        if: inputs.environment == 'prod'
        run: |
          case "${{ matrix.service }}" in
            payments)
              printf '%s' "${{ secrets.PROD_ENV_PAYMENTS }}" > /tmp/service.env
              ;;
            providers)
              printf '%s' "${{ secrets.PROD_ENV_PROVIDERS }}" > /tmp/service.env
              ;;
            coupons)
              printf '%s' "${{ secrets.PROD_ENV_COUPONS }}" > /tmp/service.env
              ;;
            preferences)
              printf '%s' "${{ secrets.PROD_ENV_PREFERENCES }}" > /tmp/service.env
              ;;
            utils)
              printf '%s' "${{ secrets.PROD_ENV_UTILS }}" > /tmp/service.env
              ;;
            reviews)
              printf '%s' "${{ secrets.PROD_ENV_REVIEWS }}" > /tmp/service.env
              ;;
            tickets)
              printf '%s' "${{ secrets.PROD_ENV_TICKETS }}" > /tmp/service.env
              ;;
            image-uploader)
              printf '%s' "${{ secrets.PROD_ENV_IMAGE_UPLOADER }}" > /tmp/service.env
              ;;
            chat)
              printf '%s' "${{ secrets.PROD_ENV_CHAT }}" > /tmp/service.env
              ;;
          esac
          if [[ ! -s /tmp/service.env ]]; then
            rm -f /tmp/service.env
            echo "::warning::PROD_ENV_* secret empty for ${{ matrix.service }} — deploy continues without overwriting .env"
          fi

      - name: Resolve EC2 deploy path
        if: inputs.environment == 'prod'
        id: ec2path
        env:
          EC2_DEPLOY_PATH_PAYMENTS: ${{ secrets.EC2_DEPLOY_PATH_PAYMENTS }}
          EC2_DEPLOY_PATH_PROVIDERS: ${{ secrets.EC2_DEPLOY_PATH_PROVIDERS }}
          EC2_DEPLOY_PATH_COUPONS: ${{ secrets.EC2_DEPLOY_PATH_COUPONS }}
          EC2_DEPLOY_PATH_PREFERENCES: ${{ secrets.EC2_DEPLOY_PATH_PREFERENCES }}
          EC2_DEPLOY_PATH_UTILS: ${{ secrets.EC2_DEPLOY_PATH_UTILS }}
          EC2_DEPLOY_PATH_REVIEWS: ${{ secrets.EC2_DEPLOY_PATH_REVIEWS }}
          EC2_DEPLOY_PATH_TICKETS: ${{ secrets.EC2_DEPLOY_PATH_TICKETS }}
          EC2_DEPLOY_PATH_IMAGE_UPLOADER: ${{ secrets.EC2_DEPLOY_PATH_IMAGE_UPLOADER }}
          EC2_DEPLOY_PATH_CHAT: ${{ secrets.EC2_DEPLOY_PATH_CHAT }}
        run: |
          default_path() {
            case "${{ matrix.service }}" in
              payments)       echo "/home/ubuntu/payments" ;;
              providers)      echo "/home/ubuntu/providers" ;;
              coupons)        echo "/home/ubuntu/coupons" ;;
              preferences)    echo "/home/ubuntu/preferences" ;;
              utils)          echo "/home/ubuntu/utils" ;;
              reviews)        echo "/home/ubuntu/reviews" ;;
              tickets)        echo "/home/ubuntu/tickets" ;;
              image-uploader) echo "/home/ubuntu/image-uploader" ;;
              chat)           echo "/home/ubuntu/chat" ;;
            esac
          }
          case "${{ matrix.service }}" in
            payments)       PATH="${EC2_DEPLOY_PATH_PAYMENTS:-$(default_path)}" ;;
            providers)      PATH="${EC2_DEPLOY_PATH_PROVIDERS:-$(default_path)}" ;;
            coupons)        PATH="${EC2_DEPLOY_PATH_COUPONS:-$(default_path)}" ;;
            preferences)    PATH="${EC2_DEPLOY_PATH_PREFERENCES:-$(default_path)}" ;;
            utils)          PATH="${EC2_DEPLOY_PATH_UTILS:-$(default_path)}" ;;
            reviews)        PATH="${EC2_DEPLOY_PATH_REVIEWS:-$(default_path)}" ;;
            tickets)        PATH="${EC2_DEPLOY_PATH_TICKETS:-$(default_path)}" ;;
            image-uploader) PATH="${EC2_DEPLOY_PATH_IMAGE_UPLOADER:-$(default_path)}" ;;
            chat)           PATH="${EC2_DEPLOY_PATH_CHAT:-$(default_path)}" ;;
          esac
          echo "path=${PATH}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 (providers / Docker)
        if: inputs.environment == 'prod' && steps.cfg.outputs.docker == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SERVICE_PATH: ${{ steps.cfg.outputs.path }}
          DEPLOY_ROOT: ${{ steps.ec2path.outputs.path }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
        run: |
          chmod +x .github/scripts/ec2-deploy-providers.sh
          .github/scripts/ec2-deploy-providers.sh

      - name: Deploy to EC2 (Node / pm2)
        if: inputs.environment == 'prod' && steps.cfg.outputs.docker != 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SERVICE: ${{ steps.cfg.outputs.ec2_app }}
          SERVICE_PATH: ${{ steps.cfg.outputs.path }}
          DEPLOY_ROOT: ${{ steps.ec2path.outputs.path }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          INSTALL_CMD: ${{ steps.cfg.outputs.install }}
          PM2_APP: ${{ steps.cfg.outputs.ec2_app }}
          PM2_SCRIPT: ${{ steps.cfg.outputs.pm2_script }}
          ENV_FILE_LOCAL: /tmp/service.env
        run: |
          chmod +x .github/scripts/ec2-deploy-node.sh
          .github/scripts/ec2-deploy-node.sh

      - name: Deployment summary
        run: |
          echo "### ${{ steps.cfg.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ inputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build version: \`${{ env.BUILD_VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "- EC2 path: \`${{ steps.ec2path.outputs.path }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Rollback: run **Rollback Backend** workflow with this version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write deploy report (notify email)
        if: always() && inputs.notify_on_deploy == true
        env:
          SERVICE: ${{ matrix.service }}
          SERVICE_LABEL: ${{ steps.cfg.outputs.label }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          JOB_STATUS: ${{ job.status }}
          RENDER_SVC_ID: ${{ env.RENDER_SVC_ID }}
          EC2_PATH: ${{ steps.ec2path.outputs.path }}
        run: |
          chmod +x .github/scripts/write-deploy-report.sh
          SUBMODULE_SHA=""
          if [[ -n "${{ steps.cfg.outputs.path }}" && -d "${{ steps.cfg.outputs.path }}/.git" ]]; then
            SUBMODULE_SHA="$(git -C "${{ steps.cfg.outputs.path }}" rev-parse HEAD 2>/dev/null || true)"
          fi
          export SUBMODULE_SHA
          .github/scripts/write-deploy-report.sh deploy-report.json

      - name: Upload deploy report
        if: always() && inputs.notify_on_deploy == true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-${{ matrix.service }}-${{ github.run_number }}
          path: deploy-report.json
          if-no-files-found: ignore

  notify-deployment:
    needs: [resolve-matrix, migrate-database, deploy]
    if: always() && needs.resolve-matrix.result == 'success' && inputs.notify_on_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download deploy reports
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-report-*-${{ github.run_number }}
          merge-multiple: true
          path: deploy-reports

      - name: Send deployment email
        env:
          DEPLOY_NOTIFY_EMAILS: ${{ secrets.DEPLOY_NOTIFY_EMAILS }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DEPLOY_NOTIFY_FROM: ${{ secrets.DEPLOY_NOTIFY_FROM }}
          WORKFLOW_STATUS: ${{ needs.deploy.result }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          MIGRATE_STATUS: ${{ needs.migrate-database.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x .github/scripts/send-deploy-notification-email.sh
          .github/scripts/send-deploy-notification-email.sh deploy-reports
